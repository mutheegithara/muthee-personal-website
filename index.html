<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Muthee Githara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: name block over a rule, three equal ruled tiles with individually clickable sub-links, about row, plain link row. Sub-pages open in place via #hash. */
:root{
  --bg:#bdbdbb; --tile:#9e9e9c; --tile-hover:#8f8f8d; --ink:#161616; --mute:#3d3d3c;
  --accent:#161616; --hot:#161616; --hot-fg:#bdbdbb;
  --rule:2px solid var(--ink);
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root{ --accent:#d9621a; --hot:#e8742a; --hot-fg:#161616; --tile-hover:#e8742a; --num:#e8742a }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0;padding-inline:clamp(16px,4vw,48px)}
a{color:inherit}
.page{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:clamp(20px,4vh,36px);padding-block:clamp(24px,5vh,56px);max-width:1140px;margin:0 auto;box-sizing:border-box}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:var(--rule);padding-bottom:12px}
.name{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;text-decoration:none}
h1{margin:0;font-weight:800;font-size:clamp(30px,5vw,56px);line-height:.9;letter-spacing:-.02em;text-transform:uppercase}
.say{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.04em;padding-bottom:2px}
.meta{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;background:var(--accent);flex:none}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--ink);border:var(--rule)}
.tile{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.main-link{display:flex;flex-direction:column;text-decoration:none}
.pic{position:relative;aspect-ratio:1/1;background:var(--tile);overflow:hidden;transition:background .2s;display:grid;place-items:center}
.pic::before,.pic::after{content:"";position:absolute;background:var(--ink);opacity:.14}
.pic::before{left:0;right:0;top:50%;height:1px}
.pic::after{top:0;bottom:0;left:50%;width:1px}
.pic svg{position:relative;width:34%;height:auto;stroke:var(--ink);fill:none;stroke-width:1.6}
.pic img{position:absolute;inset:0;margin:auto;height:74%;width:auto;max-width:80%;object-fit:contain}
.pic.logo::before,.pic.logo::after{opacity:.08}
.main-link:hover .pic,.main-link:focus-visible .pic{background:var(--tile-hover)}
.bar{height:54px;box-sizing:border-box;display:flex;justify-content:center;align-items:center;padding:0 14px;border-top:var(--rule);transition:background .2s,color .2s}
.main-link:hover .bar{background:var(--hot);color:var(--hot-fg)}
.bar h2{margin:0;line-height:1;font-size:clamp(15px,1.8vw,21px);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;text-align:center}
.chips{display:grid;grid-template-columns:repeat(var(--n,2),1fr);border-top:var(--rule)}
.chips a{line-height:1;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:13px 8px;text-align:center;text-decoration:none;transition:background .15s,color .15s}
.chips a+a{border-left:var(--rule)}
.chips a:hover,.chips a:focus-visible{background:var(--hot);color:var(--hot-fg);outline:none}
a:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}

.about{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:2px;border-top:var(--rule);padding-top:16px}
.about h3{margin:0;padding-top:4px;font-family:var(--mono);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.about p{grid-column:2 / 4;padding-left:14px;margin:0;font-size:clamp(16px,1.6vw,20px);line-height:1.45;font-weight:500;max-width:60ch}

.foot{display:flex;gap:24px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.foot a{text-decoration-color:var(--accent);text-underline-offset:3px}
.foot a:hover{color:var(--accent)}

/* sub-pages */
.view{display:flex;flex-direction:column;gap:20px}
.crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.crumbs a{text-decoration:none;border:var(--rule);padding:8px 12px}
.crumbs a:hover{background:var(--hot);color:var(--hot-fg)}
.crumbs span{color:var(--mute)}
.view h2{margin:0;font-weight:800;font-size:clamp(34px,6vw,72px);line-height:.9;letter-spacing:-.02em;text-transform:uppercase}
.subnav{display:flex;border:var(--rule);width:max-content;max-width:100%}
.subnav a{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:12px 18px;text-decoration:none}
.subnav a+a{border-left:var(--rule)}
.subnav a:hover{background:var(--hot);color:var(--hot-fg)}
.subnav a.on{background:var(--ink);color:var(--bg)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--ink);border:var(--rule)}
.slot{background:var(--tile);aspect-ratio:var(--ar,4/3);display:flex;align-items:flex-end;padding:10px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);transition:background .2s}
.slot:hover{background:var(--tile-hover)}
.tbd{font-style:normal;color:var(--mute);opacity:.7}
a.bmedia{text-decoration:none;color:inherit}
.blink{color:inherit;text-decoration:none;background:none}.blink:hover{background:var(--hot);color:var(--hot-fg)}
.brand{border:var(--rule);background:var(--bg);margin-bottom:18px}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;padding:16px;border-bottom:var(--rule)}
.bhead h3{margin:0;font-weight:800;font-size:clamp(22px,3vw,32px);text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.btag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:5px 8px;border:var(--rule);background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(22,22,22,.12) 4px 8px)}
.bmedia{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:2px;background:var(--ink)}
.bframe{position:relative;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--tile) 0 14px,var(--tile-hover) 14px 28px);transition:background .2s}
.bframe.sf{aspect-ratio:9/16}.bframe.lf{aspect-ratio:16/9;align-self:stretch;height:100%}
.bframe span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--bg);border:var(--rule);padding:6px 10px;text-align:center}
.brand:hover .bframe{background:repeating-linear-gradient(45deg,var(--tile) 0 14px,var(--hot) 14px 28px)}
.binfo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:var(--rule)}
.binfo div{padding:14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.binfo div+div{border-left:var(--rule)}
.binfo b{font-family:var(--mono);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
@media (max-width:640px){.binfo{grid-template-columns:1fr}.binfo div+div{border-left:0;border-top:var(--rule)}}
.cv{display:flex;flex-direction:column;gap:22px}
.cvtop{display:flex;flex-wrap:wrap;gap:8px}
.cvtop a{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;text-decoration:none;border:var(--rule);padding:8px 12px}
.cvtop a:hover{background:var(--hot);color:var(--hot-fg)}
.cvsec{border:var(--rule)}
.job{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;padding:16px;background:var(--bg)}
.job+.job{border-top:var(--rule)}
.job h3{margin:0 0 6px;font-weight:800;font-size:20px;text-transform:uppercase;line-height:1.05;letter-spacing:-.01em}
.job .pm{display:block;margin-top:4px}
.job ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45}
.job p{margin:0;font-size:15px;line-height:1.45}
.job:hover{background:var(--tile)}
@media (max-width:640px){.job{grid-template-columns:1fr;gap:10px}}
.rows{border:var(--rule)}
.row{display:grid;grid-template-columns:90px 1fr 1fr;gap:12px;padding:14px;font-size:15px}
.row+.row{border-top:var(--rule)}
.row .y{font-family:var(--mono);font-size:12px;color:var(--mute)}
.row:hover{background:var(--hot);color:var(--hot-fg)}
.row:hover .y{color:inherit}
.lede{margin:0;border-top:var(--rule);padding-top:18px;font-size:clamp(18px,2vw,24px);line-height:1.45;font-weight:500;max-width:52ch}

/* credits */
.tl{position:relative;height:72px;border:var(--rule);background:var(--tile)}
.tl-axis{position:absolute;left:4%;right:4%;top:50%;height:2px;background:var(--ink)}
.tl-dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--bg);border:var(--rule);padding:0;cursor:pointer;transition:background .15s,transform .15s}
.tl-dot.film{border-radius:50%}
.tl-dot:hover,.tl-dot.on{background:var(--hot);transform:scale(1.25)}
.tl-dot.soon{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,var(--bg) 2px 5px)}
.tl-y{position:absolute;top:calc(50% + 12px);transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--mute)}
.tl-key{position:absolute;top:8px;right:10px;display:flex;gap:12px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.tl-key i{display:inline-block;width:8px;height:8px;border:1.5px solid var(--ink);margin-right:5px;vertical-align:-1px}
.tl-key i.c{border-radius:50%}
.tl-key i.m{transform:rotate(45deg) scale(.85)}
.tl-dot.mv{transform:rotate(45deg) scale(.9)}
.tl-dot.mv:hover,.tl-dot.mv.on{transform:rotate(45deg) scale(1.15)}
.filters{display:flex;border:var(--rule);width:max-content;max-width:100%;flex-wrap:wrap}
.filters button{font:inherit;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:11px 16px;background:none;border:0;color:var(--ink);cursor:pointer}
.filters button+button{border-left:var(--rule)}
.filters button:hover{background:var(--hot);color:var(--hot-fg)}
.filters button.on{background:var(--ink);color:var(--bg)}
.filters sup{font-size:9px;margin-left:3px}
.clist{border:var(--rule)}
.cgroup{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:10px 14px;background:var(--ink);color:var(--bg)}
.credit+.credit,.cgroup+.credit{border-top:var(--rule)}
.credit+.cgroup{border-top:var(--rule)}
.crow{width:100%;display:grid;grid-template-columns:70px minmax(0,1.4fr) minmax(0,1fr) 130px 28px;gap:14px;align-items:center;padding:16px 14px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:background .15s,color .15s}
.crow:hover{background:var(--hot);color:var(--hot-fg)}
.crow .y{font-family:var(--mono);font-size:13px}
.crow .t{font-weight:800;font-size:clamp(18px,2.2vw,26px);text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.crow .d{font-size:14px;color:inherit;opacity:.8}
.pill{justify-self:end;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;border:1.5px solid currentColor;padding:4px 7px;white-space:nowrap}
.pill.soon{background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(22,22,22,.12) 4px 8px)}
.plus{font-family:var(--mono);font-size:20px;text-align:center;transition:transform .2s}
.credit.open .plus{transform:rotate(45deg)}
.credit.open .crow{background:var(--ink);color:var(--bg)}
.cbody{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:2px;background:var(--ink);border-top:var(--rule)}
.screen{position:relative;aspect-ratio:16/9;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.screen.soon{background:repeating-linear-gradient(45deg,var(--tile) 0 14px,var(--tile-hover) 14px 28px)}
.slate{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:11px;line-height:1.6;text-transform:uppercase;letter-spacing:.06em}
.slate b{font-weight:500;color:var(--mute);display:inline-block;width:46px}
.play{width:64px;height:64px;border:var(--rule);display:grid;place-items:center;background:var(--bg);transition:background .15s}
a.play{text-decoration:none}
.via{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.play svg{width:22px;height:22px;fill:var(--ink);margin-left:3px}
.screen:hover .play{background:var(--hot)}
.soonlabel{font-weight:800;font-size:clamp(18px,3vw,30px);text-transform:uppercase;background:var(--bg);border:var(--rule);padding:8px 14px}
.cinfo{background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:14px}
.cinfo dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.cinfo dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding-top:2px}
.cinfo dd{margin:0}
.acts{margin-top:auto;display:flex;flex-direction:column;border:var(--rule)}
.acts a{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:12px 14px;text-decoration:none}
.acts a+a{border-top:var(--rule)}
.acts a:hover{background:var(--hot);color:var(--hot-fg)}
.acts a.off{color:var(--mute);cursor:default}
.acts a.off:hover{background:none;color:var(--mute)}
@media (max-width:760px){
  .crow{grid-template-columns:52px minmax(0,1fr) 24px;row-gap:6px}
  .crow .d{grid-column:2}
  .crow .pill{grid-column:2;justify-self:start;grid-row:3}
  .crow .plus{grid-column:3;grid-row:1}
  .cbody{grid-template-columns:1fr}
  .tl-key{display:none}
}
.screen.has-video{background:#000}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.pill.vid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.crow:hover .pill.vid{background:var(--hot-fg);color:var(--hot);border-color:var(--hot-fg)}
.credit.open .pill.vid{background:var(--bg);color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--ink);border:var(--rule)}
.proj{display:flex;flex-direction:column;background:var(--bg);text-decoration:none;min-width:0}
.pframe{position:relative;aspect-ratio:16/9;background:var(--tile);display:grid;place-items:center;transition:background .2s}
.proj:not(.empty):hover .pframe{background:var(--tile-hover)}
.proj:not(.empty):hover .play{background:var(--hot)}
.pbar{display:flex;flex-direction:column;gap:6px;padding:14px;border-top:var(--rule);min-height:64px;box-sizing:border-box}
.pt{font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.pr{color:var(--ink)}
.pm{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.proj.nolink .play{opacity:.45}
.proj.empty .pframe{background:repeating-linear-gradient(45deg,var(--tile) 0 14px,var(--bg) 14px 28px);opacity:.5}
.psets{display:flex;flex-direction:column;gap:22px}.pset .cgroup{border:var(--rule);border-bottom:0}
.pgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.pgrid.two .pframe{aspect-ratio:21/9}
@media (max-width:640px){.pgrid,.pgrid.two{grid-template-columns:1fr}.pgrid.two .pframe{aspect-ratio:16/9}.proj.empty{display:none}}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:2px;background:var(--ink);border:var(--rule)}
.lart{position:relative;aspect-ratio:1/1;background:var(--tile)}
.lart img{position:absolute;inset:0;margin:auto;height:74%;width:auto;max-width:80%}
.llist{background:var(--bg);display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;align-items:center;gap:14px;padding:22px 16px;border-bottom:var(--rule);text-decoration:none;transition:background .15s,color .15s}
.lrow .ln{font-weight:800;font-size:clamp(22px,3vw,34px);text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.lrow .ls{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.lrow .la{font-family:var(--mono);font-size:18px;text-align:right}
a.lrow:hover{background:var(--hot);color:var(--hot-fg)}
.lrow.off{color:var(--mute);border-bottom:0}
.lrow.off .ln{font-size:clamp(16px,2vw,20px)}
@media (max-width:640px){.lgrid{grid-template-columns:1fr}.lart{aspect-ratio:16/10}.lrow{grid-template-columns:1fr 24px}.lrow .ls{grid-column:1}.lrow .la{grid-row:1;grid-column:2}}
.roster{display:flex;flex-direction:column;gap:0;border:var(--rule);margin-top:6px}
.rhead{display:grid;grid-template-columns:auto 1fr;gap:2px;background:var(--ink);border-bottom:var(--rule)}
.rcount{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:14px;padding:18px 22px}
.rnum{font-weight:800;font-size:clamp(44px,6vw,72px);line-height:.85;letter-spacing:-.03em;color:var(--num,var(--bg))}
.rlab{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;line-height:1.5}
.rtitle{background:var(--bg);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.rtitle h3{margin:0;font-weight:800;font-size:clamp(22px,2.6vw,30px);text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.rtitle p{margin:0;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--ink)}
.rcell{background:var(--bg);padding:16px 14px;display:flex;flex-direction:column;gap:6px;min-height:118px;box-sizing:border-box;text-decoration:none;min-width:0}
.rdj{font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:-.01em;line-height:1.05;overflow-wrap:anywhere}
.rev{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.rgo{margin-top:auto;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
a.rcell:hover{background:var(--hot);color:var(--hot-fg)}
a.rcell:hover .rev{color:inherit}
.rcell.ph .rdj,.rcell.ph .rev{opacity:.35}
.rdate{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.rcell:not(.ph) .rev{color:var(--mute)}
@media (max-width:900px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.rhead{grid-template-columns:1fr}.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hint{font-family:var(--mono);font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}

@media (max-width:900px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  .pic{aspect-ratio:16/10}
  .pic svg{width:22%}
  .pic img{height:80%}
  .meta{display:none}
  .about{grid-template-columns:1fr;gap:10px}
  .about p{grid-column:auto;padding-left:0}
  .slots{grid-template-columns:1fr}
  .row{grid-template-columns:60px 1fr}
  .row span:last-child{grid-column:2}
}
.rmore{grid-column:span var(--s4);background:var(--ink);color:var(--bg);justify-content:center}
.rmore .rev{color:var(--bg)!important;opacity:.7}
.rplus{font-weight:800;font-size:40px;line-height:.8}
.rmore:hover{background:var(--ink);color:var(--bg)}

let cFilter='all',cOpen=null;
function creditsHTML(){
  const lo=2014.5,hi=2026.5,pos=y=>(4+92*(y-lo)/(hi-lo)).toFixed(2)+'%';
  const years=[...new Set(CREDITS.map(c=>c.year))];

    years.map(y=>'<span class="tl-y" style="left:'+pos(y)+'">'+y+'</span>').join('')+
    CREDITS.map((c,i)=>{const k=CREDITS.slice(0,i).filter(x=>x.year===c.year).length;return '<button class="tl-dot '+c.type+(c.status?' soon':'')+(cOpen===c.id?' on':'')+'" style="left:'+pos(c.year)+';top:calc(50% - '+(k*20)+'px)" data-open="'+c.id+'" title="'+esc(c.title)+' '+c.year+'" aria-label="'+esc(c.title)+' '+c.year+'"></button>'}).join('')+'</div>';

            (c.video?'<a href="#credits" data-play="'+c.id+'">Play spot · '+c.len+'<span>▶</span></a>':'')+
            (c.url?'<a href="'+c.url+'" target="_blank" rel="noopener">Watch on '+host(c.url)+' <span>↗</span></a>':c.video?'':'<a class="off" aria-disabled="true">'+(soon?'Trailer coming':'Watch link coming')+'<span>—</span></a>')+
            (c.imdb?'<a href="'+c.imdb+'" target="_blank" rel="noopener">IMDb <span>↗</span></a>':'<a class="off" aria-disabled="true">IMDb<span>—</span></a>')+
          '</div></div></div>';
      }
      h+='</div>';
    }
  }
  return h+'</div>';
}
sub.addEventListener('click',e=>{
  const pl=e.target.closest('[data-play]');if(pl){e.preventDefault();const v=document.querySelector('#c-'+pl.dataset.play+' video');if(v){v.play().catch(()=>{});v.focus()}return}
  const o=e.target.closest('[data-open]'),f=e.target.closest('[data-f]');
  if(!o&&!f) return;
  if(f){cFilter=f.dataset.f}
  if(o){const id=o.dataset.open;cOpen=cOpen===id?null:id;const c=CREDITS.find(x=>x.id===id);if(cOpen&&cFilter!=='all'&&c.type!==cFilter)cFilter='all'}
  const box=document.getElementById('cwrap');if(box){box.innerHTML=creditsHTML();if(o&&cOpen&&o.classList.contains('tl-dot'))document.getElementById('c-'+cOpen).scrollIntoView({block:'nearest',behavior:'smooth'})}
});
function render(){
  const k0=location.hash.slice(1),k=k0==='headshots'?'credits':k0;
  let v=S[k];
  if(!v){home.hidden=false;sub.hidden=true;return}
  const sec=v.parent?S[v.parent]:v, secKey=v.parent||k;
  const active=v.parent?k:(sec.tabs[0]||k), a=S[active];
  let body='';
  if(a.kind==='listen') body='<div class="lgrid"><div class="lart"><img src="'+document.querySelector('.pic.logo img').src+'" alt="A WHYL logo"></div><div class="llist"><div class="cgroup">Stream A WHYL</div>'+
    a.links.map(l=>'<a class="lrow" href="'+l.url+'" target="_blank" rel="noopener"><span class="ln">'+esc(l.name)+'</span><span class="ls">'+esc(l.sub)+'</span><span class="la">↗</span></a>').join('')+
    '<div class="lrow off"><span class="ln">More soon</span><span class="ls">Mixes · SoundCloud · Apple Music</span><span class="la">—</span></div></div></div>';
  else if(a.kind==='projects'){const card=p=>(p.url?'<a class="proj" href="'+p.url+'" target="_blank" rel="noopener">':'<div class="proj nolink">')+'<div class="pframe">'+(p.url?'<span class="via">'+host(p.url)+' ↗</span><span class="play"><svg viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z"/></svg></span>':'<span class="via">Link coming</span><span class="play"><svg viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z"/></svg></span>')+'</div><div class="pbar"><span class="pt">'+esc(p.title)+'</span><span class="pm">'+esc(p.type)+(p.place?' · '+esc(p.place):'')+'</span>'+(p.role?'<span class="pm pr">'+esc(p.role)+'</span>':'')+(p.role2?'<span class="pm pr">'+esc(p.role2)+'</span>':'')+'</div>'+(p.url?'</a>':'</div>');
    const g=(lab,arr,cls)=>arr.length?'<div class="pset"><div class="cgroup">'+lab+'</div><div class="pgrid'+(cls?' '+cls:'')+'">'+arr.map(card).join('')+'</div></div>':'';
    body='<div class="psets">'+g('Recent work',a.items.filter(p=>!p.group),'')+g('Documentary &amp; impact · 2019',a.items.filter(p=>p.group==='docs'),'two')+'</div>'}
  if(a.kind==='projects'&&a.roster){const r=a.roster,n=r.names.length,list=r.names,s4=(4-n%4)%4||4,s2=(2-n%2)%2||2;
    body+='<section class="roster"><div class="rhead"><div class="rcount"><span class="rnum">'+r.count+'</span><span class="rlab">Events shot in<br>Boston &amp; Los Angeles</span></div><div class="rtitle"><h3>Events</h3><p>Recaps and promo content shot live.</p></div></div>'+
    '<div class="rgrid">'+list.map(n=>(n.url?'<a class="rcell" href="'+n.url+'" target="_blank" rel="noopener">':'<div class="rcell'+(n.ph?' ph':'')+'">')+(n.date?'<span class="rdate">'+esc(n.date)+'</span>':'')+'<span class="rdj">'+esc(n.dj)+'</span><span class="rev">'+esc(n.ev||'')+'</span>'+(n.url?'<span class="rgo">'+host(n.url)+' ↗</span></a>':'</div>')).join('')+'<div class="rcell rmore" style="--s4:'+s4+';--s2:'+s2+'"><span class="rplus">+</span><span class="rdj">And many more</span><span class="rev">Club nights · festivals · brand events · Boston &amp; LA</span></div>'+'</div></section>';}
  if(a.kind==='projects');
  else if(a.kind==='brands') body=a.items.map(b=>{const L=b.url?'<a class="btag blink" href="'+b.url+'" target="_blank" rel="noopener">'+esc(b.status)+'</a>':'<span class="btag">'+esc(b.status)+'</span>',v=(x,d)=>x?esc(x):'<i class="tbd">'+d+'</i>';
    return '<section class="brand"><div class="bhead"><h3>'+esc(b.name)+'</h3>'+L+'</div>'+
    (b.url?'<a class="bmedia" href="'+b.url+'" target="_blank" rel="noopener"><div class="bframe sf"><span>Short-form<br>Clip to add</span></div><div class="bframe lf"><span>Long-form · Clip to add</span></div></a>':'<div class="bmedia"><div class="bframe sf"><span>Short-form<br>Coming soon</span></div><div class="bframe lf"><span>Long-form · Coming soon</span></div></div>')+
    '<div class="binfo"><div><b>Role</b>'+v(b.role,'Your role')+'</div><div><b>Formats</b>'+v(b.formats,'What you made')+'</div><div><b>Based</b>'+v(b.place,'City')+'</div></div></section>'}).join('');
  else if(a.kind==='resume'){const job=j=>'<div class="job"><div><h3>'+esc(j.role)+'</h3><span class="pm">'+esc(j.org)+'</span>'+(j.when?'<span class="pm">'+esc(j.when)+'</span>':'')+(j.where&&j.pts?'<span class="pm">'+esc(j.where)+'</span>':'')+'</div>'+(j.pts?'<ul>'+j.pts.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'<p>'+esc(j.where||'')+'</p>')+'</div>';
    body='<div class="cv"><div class="cvtop">'+a.contact.map(c=>'<a href="'+c[1]+'"'+(c[1].startsWith('http')?' target="_blank" rel="noopener"':'')+'>'+c[0]+'</a>').join('')+'</div>'+
    '<p class="lede">'+esc(a.summary)+'</p>'+
    '<div class="cvsec"><div class="cgroup">Experience</div>'+a.jobs.map(job).join('')+'</div>'+
    '<div class="cvsec"><div class="cgroup">Education</div>'+a.edu.map(job).join('')+'</div>'+
    '<div class="cvsec"><div class="cgroup">On camera</div><div class="job"><div><h3>Acting & modeling</h3><span class="pm">Toyota · Apple · Volkswagen</span></div><p>'+esc(a.camera)+'</p></div></div>'+
    '<div class="cvsec"><div class="cgroup">Skills & tools</div>'+a.skills.map(r=>'<div class="job"><div><h3>'+esc(r[0])+'</h3></div><p>'+esc(r[1])+'</p></div>').join('')+'</div></div>'}
  else if(a.kind==='credits') body='<div id="cwrap" style="display:flex;flex-direction:column;gap:14px">'+creditsHTML()+'</div>';
  else if(a.kind==='text') body='<div class="about">'+[].concat(a.text).map(t=>'<p class="lede">'+esc(t)+'</p>').join('')+'</div>';
  else if(a.kind==='rows') body='<div class="rows">'+a.rows.map(r=>'<div class="row"><span class="y">'+r[0]+'</span><span>'+esc(r[1])+'</span><span>'+esc(r[2])+'</span></div>').join('')+'</div>';
  else body='<div class="slots" style="--ar:'+a.ar+'">'+Array.from({length:a.n},(_,i)=>'<div class="slot">'+a.label+' '+(i+1)+'</div>').join('')+'</div>';
  sub.innerHTML='<div class="crumbs"><a href="#home">← Home</a><span>/ '+esc(sec.title)+'</span></div>'+
    '<h2>'+esc(sec.title)+'</h2>'+
    (sec.tabs.length?'<nav class="subnav">'+sec.tabs.map(t=>'<a href="#'+t+'" class="'+(t===active?'on':'')+'">'+S[t].label+'</a>').join('')+'</nav>':'')+
    body;
  home.hidden=true;sub.hidden=false;window.scrollTo(0,0);
}
addEventListener('hashchange',render);render();
</script>
